[package]
name = "tokscale-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for tokscale - session parsing, scanning, aggregation, pricing"

[lib]
crate-type = ["rlib"]

[dependencies]
rayon = { workspace = true }
simd-json = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
walkdir = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
once_cell = { workspace = true }
rusqlite = { workspace = true }
zstd = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
fs2 = { workspace = true }

# FORK NOTE: optional, off by default — see the `specta` feature below.
specta = { workspace = true, optional = true }

# Same per-target TLS gates as tokscale-cli; see the long rationale there.
# Both crates need them: `use_native_tls()` and `use_rustls_tls()` only exist
# when the corresponding reqwest feature is on for the crate being compiled,
# and a standalone `tokscale-core` build must resolve the same way the CLI
# binary does rather than relying on feature unification from the binary.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["native-tls-vendored"] }

# FORK NOTE: not upstream.
[features]
# Derives `specta::Type` alongside the existing `serde` derives so the
# tokscale-gui Tauri backend can generate TypeScript bindings for these types.
# The orphan rule blocks deriving from the GUI crate, so the derives live here.
# Which types carry the derive is decided by tokscale-gui's "Design the Tauri
# command surface for P1"; this gate exists ahead of that so the plumbing is in
# place. Nothing upstream enables it.
specta = ["dep:specta"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
